# Frischklon-CI (Codex-Audit P1, gebaut 2026-08-07) — beweist, dass ein
# nackter Checkout baut und die Suiten grün sind. BEWUSST ohne Modelle,
# ohne Sidecars-Laufzeit, ohne mlx (das ist Apple-Silicon-only, s. SETUP.md):
# hier wird gebaut und getestet, nicht gesprochen. Der echte Voice-Beweis
# bleibt `bin/hoshi voice` auf einem Mac.
name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Gradle · JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # `build` = alle Kotlin-Module + Unit-Tests + ArchUnit-Guards — exakt
      # der erste Schritt aus SETUP.md, nur eben auf einer fremden Maschine.
      - run: ./gradlew build --no-daemon

  frontend:
    name: Frontend (npm ci · Test · Build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      # Build liest ../gradle.properties (Versions-Wahrheit) — der Grep danach
      # beweist, dass die echte Version im Bundle steht, nicht der dev-Fallback.
      - run: npm run build
      - run: grep -q "$(sed -n 's/^version=//p' ../gradle.properties)" dist/assets/index-*.js

  scripts:
    name: Skripte (bash -n · py_compile · JSON)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Syntax-Wache über die Betriebs-Skripte — genau die Fehlerklasse, die
      # ein halb gelandeter Schnitt hinterlässt (Lehre vom 26.07.).
      - run: |
          set -e
          for f in bin/hoshi pipeline/*.sh sidecars/*/run.sh sidecars/*/bootstrap.sh; do
            bash -n "$f"
          done
      # py_compile importiert nichts — prüft reine Syntax, braucht kein mlx.
      - run: python3 -m py_compile sidecars/*/server.py
      - run: python3 -m json.tool models.json > /dev/null

  python-tests:
    # CI-POD-Befund (2026-08-20/22): 20 test_*.py-Dateien (8.487 Zeilen) unter
    # sidecars/*/test_*.py + tools/**/test_*.py liefen NIE über py_compile
    # hinaus. Details/Inventar/Rate-Stellen: RESULT.md im gleichen Commit.
    name: Python-Suiten (pytest, ohne Modelle/echte DB)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Bewusst schlankes, GB-freies Setup: NUR die echten Pins, die die
      # eingeschlossenen Tests selbst importieren — fastapi/pydantic/
      # zstandard/pytest 1:1 aus sidecars/knowledge/requirements-dev.txt
      # (Quelle der Wahrheit), plus numpy + tqdm einzeln (aus sidecars/stt/
      # bzw. sidecars/brain requirements.txt herauskopiert, OHNE deren
      # schwere Nachbarn torch/mlx/mlx-whisper/onnxruntime zu ziehen).
      - run: |
          set -e
          pip install -r sidecars/knowledge/requirements-dev.txt
          pip install numpy==2.4.6 tqdm==4.68.1
      # Jedes Verzeichnis einzeln = eigener Python-Prozess: mehrere Sidecars/
      # Tools haben gleichnamige lokale Module (server.py, collect.py,
      # schema.py) — ein gemeinsamer pytest-Lauf über mehrere Verzeichnisse
      # wuerde sys.modules-Kollisionen zwischen ihnen verursachen.
      #
      # Bewusst NICHT dabei (Details/Begruendung: RESULT.md):
      #   sidecars/brain               — braucht mlx.core/mlx_lm + echtes
      #                                   Gemma-4-Modell (Apple-Silicon-only)
      #   sidecars/speaker              — test_decode_audio.py braucht das
      #                                   echte CAM++-ONNX-Modell auf Platte
      #   sidecars/knowledge/test_fact_gate_battery.py — kein pytest/unittest-
      #                                   Case, sondern ein Batterie-Skript
      #                                   gegen die ECHTE ~7-GB articles.db
      - run: |
          set -e
          export HOSHI_WIKI_DB_PATH=/dev/null
          python3 -m pytest sidecars/knowledge -q --ignore=sidecars/knowledge/test_fact_gate_battery.py
          for d in sidecars/piper sidecars/stt \
                   tools/command-replay tools/knowledge-bench \
                   tools/knowledge-library tools/knowledge-pack \
                   tools/memory-bench tools/speaker-ab; do
            echo "::group::pytest $d"
            python3 -m pytest "$d" -q
            echo "::endgroup::"
          done
          python3 -m pytest tools/test_verified_fetch.py -q
